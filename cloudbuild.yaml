steps:
  # Install dependencies
  - name: 'python:3.9'
    entrypoint: 'pip'
    args: ['install', '-r', 'requirements.txt', '--user']

  # Initialize Airflow DB
  - name: 'python:3.9'
    entrypoint: 'python'
    args: ['-c', 'import airflow.utils.db; airflow.utils.db.resetdb()']
    env:
      - 'AIRFLOW_HOME=/workspace'

  # Run DAG validation tests
  - name: 'python:3.9'
    entrypoint: 'python'
    args: ['-m', 'pytest', 'tests/test_dags.py']
    env:
      - 'AIRFLOW_HOME=/workspace'

  # Sync DAGs to Composer bucket
  - name: 'python:3.9'
    entrypoint: 'python'
    args: ['utils/sync_dags.py']
    env:
      - 'COMPOSER_BUCKET=${_COMPOSER_BUCKET}'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _COMPOSER_BUCKET: 'asia-southeast1-test-compos-171ca46c-bucket'  # e.g., us-central1-composer-dev-abc123-dags