steps:
  # Install dependencies
  - name: 'python:3.9'
    entrypoint: 'pip'
    args: ['install', '-r', 'requirements.txt']

  # Run DAG validation tests
  - name: 'python:3.9'
    entrypoint: 'python'
    args: ['-m', 'pytest', 'tests/test_dags.py']

  # Sync DAGs to Composer bucket (only on merge to main)
  - name: 'python:3.9'
    entrypoint: 'python'
    args: ['utils/sync_dags.py']
    env:
      - 'COMPOSER_BUCKET=${_COMPOSER_BUCKET}'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _COMPOSER_BUCKET: 'asia-southeast1-test-compos-171ca46c-bucket'  # e.g., us-central1-composer-dev-abc123-dags